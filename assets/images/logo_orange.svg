<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="orgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>
  <!-- Orange Square Base -->
  <rect width="120" height="120" rx="28" fill="url(#orgBg)"/>
  
  <!-- Orange Brand Typography -->
  <g fill="#FFFFFF">
    <!-- "orange" text -->
    <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="23" text-anchor="middle" letter-spacing="-0.8">orange</text>
    
    <!-- "money" pill -->
    <rect x="22" y="70" width="76" height="22" rx="11" fill="#FFFFFF"/>
    <text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#FF7900" text-anchor="middle" letter-spacing="1">MONEY</text>
  </g>
</svg>
