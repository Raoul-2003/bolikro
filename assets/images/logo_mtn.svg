  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10" fill="#FFCC00" text-anchor="middle" letter-spacing="1">MTN</text>
