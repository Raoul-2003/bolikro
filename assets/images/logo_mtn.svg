  <!-- MTN Oval Emblem -->
  <ellipse cx="60" cy="54" rx="46" ry="28" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- "MoMo" text -->
  <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#000000" text-anchor="middle" letter-spacing="-0.5">MoMo</text>
  
  <!-- "MTN" badge -->
